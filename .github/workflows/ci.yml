name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # gradle.properties pins a Windows-ROOT trust store for local Windows
      # builds, which leaves the JVM with no TLS on Linux. The home properties
      # file wins over the project one, so override the JVM args here.
      - name: Override the Windows trust store for this runner
        run: |
          echo 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' \
            >> "$GRADLE_USER_HOME/gradle.properties"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
