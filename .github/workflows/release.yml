name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # gradle.properties pins a Windows-ROOT trust store for local Windows
      # builds, which leaves the JVM with no TLS on Linux. The home properties
      # file wins over the project one, so override the JVM args here.
      - name: Override the Windows trust store for this runner
        run: |
          echo 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' \
            >> "$GRADLE_USER_HOME/gradle.properties"

      # Every published APK so far was signed with the Android debug key, so
      # keep using it: a different key would make existing installs refuse the
      # upgrade. The debug key's password is public, so this is not a
      # tamper-proof signature and Play will not accept it — swapping in a real
      # key is a deliberate break that needs its own release.
      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "DEBUG_KEYSTORE_BASE64 is not set; it must hold the key that signed v0.5 and v0.6.0." >&2
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          cat > keystore/release.properties <<'EOF'
          storeFile=keystore/release.jks
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble release APK
        run: ./gradlew assembleRelease

      # Guard the upgrade path: the certificate has to be the one users already
      # trust, whatever the runner happened to pick up.
      - name: Verify the APK carries the published certificate
        env:
          EXPECTED_SHA256: 0b1526ce8624baaef38db8459ddb7cf6a5378d103e68037e65f8ea89b0650c50
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk > certs.txt
          cat certs.txt
          if ! grep -qi "certificate SHA-256 digest: $EXPECTED_SHA256" certs.txt; then
            echo "APK certificate does not match the one published users have installed." >&2
            exit 1
          fi

      - name: Rename APK to the release asset name
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk \
             "robonix-client-android-v${VERSION}.apk"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Robonix Android 客户端 $GITHUB_REF_NAME" \
            --generate-notes \
            "robonix-client-android-${GITHUB_REF_NAME}.apk"

      - name: Remove the keystore from the runner
        if: always()
        run: rm -rf keystore
