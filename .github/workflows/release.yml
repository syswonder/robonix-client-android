name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # gradle.properties pins a Windows-ROOT trust store for local Windows
      # builds, which leaves the JVM with no TLS on Linux. The home properties
      # file wins over the project one, so override the JVM args here.
      - name: Override the Windows trust store for this runner
        run: |
          echo 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' \
            >> "$GRADLE_USER_HOME/gradle.properties"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "RELEASE_KEYSTORE_BASE64 is not set; refusing to publish a debug-signed APK." >&2
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          cat > keystore/release.properties <<EOF
          storeFile=keystore/release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble release APK
        run: ./gradlew assembleRelease

      - name: Verify the APK is not debug-signed
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk > certs.txt
          cat certs.txt
          if grep -qi 'CN=Android Debug' certs.txt; then
            echo "APK is debug-signed; aborting." >&2
            exit 1
          fi

      - name: Rename APK to the release asset name
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk \
             "robonix-client-android-v${VERSION}.apk"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Robonix Android 客户端 $GITHUB_REF_NAME" \
            --generate-notes \
            "robonix-client-android-${GITHUB_REF_NAME}.apk"

      - name: Remove the keystore from the runner
        if: always()
        run: rm -rf keystore
